name: Build Multilingual AI TTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run App Setup Script & Download Sherpa-ONNX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "Setup.sh" ]; then mv Setup.sh setup.sh; fi
          chmod +x setup.sh
          ./setup.sh

          mkdir -p app/libs
          AAR_URL=""
          for p in 1 2 3 4 5; do
            AAR_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=100&page=$p" | grep -o 'https://[^"]*\.aar' | grep -v 'rknn' | head -n 1)
            if [ -n "$AAR_URL" ]; then break; fi
          done
          echo "Found AAR URL: $AAR_URL"
          wget -q "$AAR_URL" -O app/libs/sherpa-onnx.aar

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle-8.5.zip
          unzip -q /tmp/gradle-8.5.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5

      - name: Download & Verify Offline AI Models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models

          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-hi_IN-rohan-medium.tar.bz2 && tar -xjf vits-piper-hi_IN-rohan-medium.tar.bz2 && rm vits-piper-hi_IN-rohan-medium.tar.bz2
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-medium.tar.bz2 && tar -xjf vits-piper-en_US-amy-medium.tar.bz2 && rm vits-piper-en_US-amy-medium.tar.bz2

          MODELS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models")
          GUJ_URL=$(echo "$MODELS_JSON" | grep -o 'https://[^"]*gu[^"]*\.tar\.bz2' | head -n 1)
          SAN_URL=$(echo "$MODELS_JSON" | grep -o 'https://[^"]*san[^"]*\.tar\.bz2' | head -n 1)
          echo "GUJ_URL=$GUJ_URL"
          echo "SAN_URL=$SAN_URL"

          if [ -n "$GUJ_URL" ]; then
            wget -q "$GUJ_URL" -O guj.tar.bz2 && mkdir -p guj_model && tar -xjf guj.tar.bz2 -C guj_model --strip-components=1 && rm guj.tar.bz2
          fi
          if [ -n "$SAN_URL" ]; then
            wget -q "$SAN_URL" -O san.tar.bz2 && mkdir -p san_model && tar -xjf san.tar.bz2 -C san_model --strip-components=1 && rm san.tar.bz2
          fi

          ls -la

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Multilingual-AI-TTS-App
          path: app/build/outputs/apk/debug/app-debug.apk
