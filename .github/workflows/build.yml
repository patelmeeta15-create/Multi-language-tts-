name: Build Multilingual AI TTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run App Setup Script & Fix Sherpa-ONNX
        run: |
          if [ -f "Setup.sh" ]; then mv Setup.sh setup.sh; fi
          chmod +x setup.sh
          ./setup.sh
          
          # Find the exact live Android AAR URL across recent sherpa-onnx releases
          mkdir -p app/libs
          AAR_URL=$(curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=15" | grep -o 'https://[^"]*sherpa-onnx[^"]*\.aar' | head -n 1)
          echo "Found AAR URL: $AAR_URL"
          wget -q "$AAR_URL" -O app/libs/sherpa-onnx.aar
          ls -lh app/libs/sherpa-onnx.aar
          
          # Replace missing Maven dependency with local AAR in app/build.gradle
          sed -i '/sherpa-onnx/d' app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation files("libs\/sherpa-onnx.aar")/' app/build.gradle
          
          gradle wrapper --gradle-version 8.5

      - name: Download Offline AI Models (Gujarati, Hindi, Sanskrit, English)
        run: |
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models
          
          # Gujarati (Meta MMS-TTS)
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mms-guj.tar.bz2 && tar -xjf vits-mms-guj.tar.bz2 && rm vits-mms-guj.tar.bz2
          
          # Sanskrit (Meta MMS-TTS)
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mms-san.tar.bz2 && tar -xjf vits-mms-san.tar.bz2 && rm vits-mms-san.tar.bz2
          
          # Hindi (Piper AI Voice)
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-hi_IN-rohan-medium.tar.bz2 && tar -xjf vits-piper-hi_IN-rohan-medium.tar.bz2 && rm vits-piper-hi_IN-rohan-medium.tar.bz2
          
          # English (Piper AI Voice matching setup.sh: amy-medium)
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-medium.tar.bz2 && tar -xjf vits-piper-en_US-amy-medium.tar.bz2 && rm vits-piper-en_US-amy-medium.tar.bz2
          
          ls -la

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Multilingual-AI-TTS-App
          path: app/build/outputs/apk/debug/app-debug.apk
