name: Build Multilingual AI TTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run App Setup Script & Download Sherpa-ONNX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "Setup.sh" ]; then mv Setup.sh setup.sh; fi
          chmod +x setup.sh
          ./setup.sh

          mkdir -p app/libs
          AAR_URL=""
          for p in 1 2 3 4 5; do
            AAR_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=100&page=$p" | grep -o 'https://[^"]*\.aar' | grep -v 'rknn' | head -n 1)
            if [ -n "$AAR_URL" ]; then break; fi
          done
          echo "Found AAR URL: $AAR_URL"
          curl -fL "$AAR_URL" -o app/libs/sherpa-onnx.aar
          ls -lh app/libs/sherpa-onnx.aar

          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5.zip
          unzip -q /tmp/gradle-8.5.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5

      - name: Download Offline AI Models (Gujarati, Hindi, Sanskrit, English)
        run: |
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models

          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mms-guj.tar.bz2 | tar -xj
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mms-san.tar.bz2 | tar -xj
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-hi_IN-rohan-medium.tar.bz2 | tar -xj
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-medium.tar.bz2 | tar -xj

          ls -la

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Multilingual-AI-TTS-App
          path: app/build/outputs/apk/debug/app-debug.apk
